name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

jobs:
    verify-package:
        if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
            - uses: actions/setup-node@v6
              with:
                  node-version: '24.13.0'
                  cache: npm
            - run: npm ci
            - run: npm run test:package

    release:
        if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
        needs: verify-package
        uses: koslibs/configs/.github/workflows/npm-release.yml@v1.0.0
        with:
            node-version: '24.13.0'
        secrets:
            npm_token: ${{ secrets.NPM_TOKEN }}
